<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Todo App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #1B3A6B;
      margin-bottom: 24px;
      font-size: 26px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #1B3A6B;
    }

    button.add-btn {
      padding: 12px 20px;
      background: #1B3A6B;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }

    button.add-btn:hover {
      background: #185FA5;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #888;
      margin-bottom: 16px;
    }

    ul {
      list-style: none;
    }

    li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: #f8f9fb;
      border-radius: 8px;
      margin-bottom: 10px;
      transition: all 0.2s;
    }

    li.done span.text {
      text-decoration: line-through;
      color: #aaa;
    }

    li input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    span.text {
      flex: 1;
      font-size: 15px;
      color: #1A1A1A;
    }

    button.del-btn {
      background: #FCEBEB;
      color: #A32D2D;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    button.del-btn:hover {
      background: #f5c6c6;
    }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 14px;
      padding: 30px 0;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>My Todo List</h1>

  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Add a new task..." />
    <button class="add-btn" onclick="addTask()">Add</button>
  </div>

  <div class="stats">
    <span id="totalCount">Total: 0</span>
    <span id="doneCount">Done: 0</span>
  </div>

  <ul id="taskList">
    <li class="empty" id="emptyMsg">No tasks yet. Add one above!</li>
  </ul>
</div>

<script>
  let tasks = [];

  function addTask() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();

    if (text === '') {
      alert('Please type a task first!');
      return;
    }

    tasks.push({ text: text, done: false });
    input.value = '';
    renderTasks();
  }

  // pressing Enter also adds task
  document.getElementById('taskInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') addTask();
  });

  function toggleDone(index) {
    tasks[index].done = !tasks[index].done;
    renderTasks();
  }

  function deleteTask(index) {
    tasks.splice(index, 1);
    renderTasks();
  }

  function renderTasks() {
    const list = document.getElementById('taskList');
    const emptyMsg = document.getElementById('emptyMsg');
    const totalCount = document.getElementById('totalCount');
    const doneCount = document.getElementById('doneCount');

    list.innerHTML = '';

    if (tasks.length === 0) {
      list.innerHTML = '<li class="empty">No tasks yet. Add one above!</li>';
      totalCount.textContent = 'Total: 0';
      doneCount.textContent = 'Done: 0';
      return;
    }

    tasks.forEach(function(task, index) {
      const li = document.createElement('li');
      if (task.done) li.classList.add('done');

      li.innerHTML = `
        <input type="checkbox" ${task.done ? 'checked' : ''}
          onchange="toggleDone(${index})" />
        <span class="text">${task.text}</span>
        <button class="del-btn" onclick="deleteTask(${index})">Delete</button>
      `;

      list.appendChild(li);
    });

    const doneTotal = tasks.filter(t => t.done).length;
    totalCount.textContent = 'Total: ' + tasks.length;
    doneCount.textContent = 'Done: ' + doneTotal;
  }
</script>

</body>
</html>
